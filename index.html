<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffe5f0">
<title>姐姐，可以跟我和好吗？♡</title>
<style>
:root {
  --pink: #ffb8d2;
  --deep: #e979a5;
  --light: #fff4f8;
  --ink: #80576b;
  --pixel: 4px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: #ffe8f1;
  background-image:
    linear-gradient(45deg,#fbd6e5 25%,transparent 25%),
    linear-gradient(-45deg,#fbd6e5 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#fbd6e5 75%),
    linear-gradient(-45deg,transparent 75%,#fbd6e5 75%);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: "Courier New", "Microsoft YaHei", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 12px;
  overflow-x: hidden;
}
button { font: inherit; -webkit-tap-highlight-color: transparent; }
.app {
  position: relative;
  width: 100%;
  max-width: 440px;
  min-height: 610px;
  background: rgba(255,250,252,.96);
  border: 4px solid white;
  outline: 2px solid #f2a4c3;
  box-shadow: 7px 7px 0 #eeb1ca;
  padding: 20px 17px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  overflow: hidden;
}
.top {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 1px;
  color: #d17d9f;
}
.pixel-heart { font-size: 18px; animation: beat 1s steps(2) infinite; }
h1 {
  margin: 20px 0 0;
  font-size: clamp(19px,5.5vw,25px);
  line-height: 1.5;
  color: #d85f92;
  text-shadow: 2px 2px #ffe0eb;
}
.subtitle { font-size: 11px; margin-top: 7px; color: #c58da5; }
.stage {
  margin-top: 13px;
  border: 1px dashed #eeb0c8;
  padding: 5px 11px;
  font-size: 10px;
  color: #cf7299;
  background: #fff0f6;
}
.scene {
  width: 100%;
  min-height: 190px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin: 12px 0 2px;
}
.sparkle {
  position: absolute;
  color: #f19abd;
  font-size: 23px;
  animation: twinkle 1.5s steps(2) infinite;
}
.s1 { top: 22px; left: 15%; }
.s2 { top: 43px; right: 13%; animation-delay: .4s; }
.s3 { bottom: 20px; left: 22%; animation-delay: .8s; }
.s4 { bottom: 25px; right: 19%; }
.pet {
  position: relative;
  font-family: sans-serif;
  font-size: 108px;
  line-height: 1.25;
  filter: drop-shadow(3px 5px 0 #f7c5d9);
  transform-origin: 50% 85%;
  animation: idle 1.5s ease-in-out infinite;
  z-index: 1;
  user-select: none;
}
.pet::after {
  content: "♡";
  position: absolute;
  font-size: 27px;
  color: #ed80aa;
  top: -5px;
  right: -4px;
  animation: beat .8s steps(2) infinite;
}
.scene.sad .pet { animation: sad 1.3s ease-in-out infinite; }
.scene.cry .pet { animation: cry 1.1s ease-in-out infinite; }
.scene.happy .pet { animation: happy .65s ease-in-out infinite; }
.scene.tease .pet { animation: tease 1.1s ease-in-out infinite; }
.scene.shy .pet { animation: shy 1.4s ease-in-out infinite; }
.scene.love .pet { animation: happy .7s ease-in-out infinite; }
.scene.hug .pet { animation: hug .9s ease-in-out infinite; }
.scene.hug .pet::after { content: "♥"; }
.pair {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 0;
  font-size: 82px;
  line-height: 1.2;
  filter: drop-shadow(3px 4px 0 #f7c5d9);
}
.scene.hug .pet { display: none; }
.scene.hug .pair { display: flex; animation: hug .9s ease-in-out infinite; }
.speech {
  width: 100%;
  position: relative;
  background: white;
  border: 2px solid #f2a4c3;
  box-shadow: 3px 3px 0 #f9d0e0;
  border-radius: 15px;
  padding: 17px 15px;
  min-height: 112px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.speech::before {
  content: "";
  position: absolute;
  top: -9px;
  left: calc(50% - 7px);
  width: 12px;
  height: 12px;
  background: white;
  border-top: 2px solid #f2a4c3;
  border-left: 2px solid #f2a4c3;
  transform: rotate(45deg);
}
#message {
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.95;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  transition: opacity .16s ease;
}
.buttons {
  width: 100%;
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 19px;
}
.btn {
  flex: 1;
  min-height: 48px;
  border: 0;
  cursor: pointer;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
  transition: transform .15s, box-shadow .15s;
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.yes {
  color: white;
  background: #f18bb3;
  box-shadow: 0 4px 0 #d96c99;
}
.no {
  color: #bc7793;
  background: #ffe5ef;
  border: 2px solid #f5b5cd;
  box-shadow: 0 4px 0 #efc2d4;
}
.progress {
  margin-top: 17px;
  width: 100%;
  height: 7px;
  background: #ffe5ef;
  border: 1px solid #f7c2d6;
  padding: 1px;
}
#bar {
  height: 100%;
  width: 0;
  background: repeating-linear-gradient(
    90deg,#ed8db4 0 8px,#f8b7d0 8px 12px
  );
  transition: width .3s;
}
.footer { font-size: 10px; color: #d39bb1; margin-top: 12px; }
.paws { margin-top: 8px; letter-spacing: 7px; font-size: 13px; opacity: .65; }
.float-heart {
  position: fixed;
  pointer-events: none;
  z-index: 10;
  animation: floatUp 1.8s ease-out forwards;
}
.hidden { display: none !important; }
@keyframes idle {
  0%,100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-7px) rotate(-3deg); }
}
@keyframes sad {
  0%,100% { transform: translateY(3px) rotate(-5deg); }
  50% { transform: translateY(8px) rotate(5deg); }
}
@keyframes cry {
  0%,100% { transform: translateY(0) rotate(-7deg); }
  50% { transform: translateY(6px) rotate(7deg); }
}
@keyframes happy {
  0%,100% { transform: translateY(0) scale(1) rotate(-5deg); }
  50% { transform: translateY(-14px) scale(1.06) rotate(5deg); }
}
@keyframes tease {
  0%,100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}
@keyframes shy {
  0%,100% { transform: scale(1) rotate(0); }
  50% { transform: scale(.95) rotate(-5deg); }
}
@keyframes hug {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08) translateY(-5px); }
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}
@keyframes twinkle {
  0%,100% { opacity: .45; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.2); }
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(.7) rotate(0); }
  100% { opacity: 0; transform: translateY(-150px) scale(1.5) rotate(20deg); }
}
@media(max-width:380px) {
  .app { padding: 15px 12px 13px; min-height: 580px; }
  .scene { min-height: 165px; }
  .pet { font-size: 92px; }
  #message { font-size: 14px; }
  .speech { padding: 14px 11px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration: 2s !important; }
}

/* ===== 气泡自适应文字高度 ===== */
.speech {
  width: 100%;
  position: relative;
  background: white;
  border: 2px solid #f2a4c3;
  box-shadow: 3px 3px 0 #f9d0e0;
  border-radius: 15px;
  padding: 14px 15px;
  min-height: 0;
  height: auto;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.speech::before {
  content: "";
  position: absolute;
  top: -9px;
  left: calc(50% - 7px);
  width: 12px;
  height: 12px;
  background: white;
  border-top: 2px solid #f2a4c3;
  border-left: 2px solid #f2a4c3;
  transform: rotate(45deg);
}

#message {
  width: 100%;
  margin: 0;
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  word-break: normal;
  white-space: pre-wrap;
  text-align: center;
}

/* 页面高度也跟随内容变化 */
.app {
  min-height: 0;
  height: auto;
}

/* 小屏幕手机适配 */
@media (max-width: 380px) {
  .speech {
    padding: 12px 10px;
  }

  #message {
    font-size: 14px;
    line-height: 1.8;
  }

  .app {
    min-height: 0;
    height: auto;
    padding: 15px 12px 13px;
  }
}
  
/* ===== 使用 emoji 文件夹中的真实动图 ===== */
.pet {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 180px;
  font-size: 0;
  line-height: normal;
  filter: none;
  animation: none;
  transform: none;
  user-select: none;
}

.pet::after {
  content: none;
}

.pet img {
  display: block;
  width: 100%;
  height: 180px;
  object-fit: contain;
  image-rendering: auto;
  animation: none;
}

/* 图片结局不再显示原来的 emoji 拥抱 */
.scene.hug .pet {
  display: flex;
}

.scene.hug .pair {
  display: none;
}

@media (max-width: 380px) {
  .pet,
  .pet img {
    height: 155px;
  }
}
/* ===== 按钮互动：累积增长、独立尺寸、允许重叠 ===== */
.app {
  overflow: hidden;
}

.buttons {
  position: relative;
  width: 100%;
  min-width: 0;
  min-height: 52px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  overflow: hidden;
  isolation: isolate;
}

.btn {
  box-sizing: border-box;
  flex-shrink: 0;
  min-width: 0;
  touch-action: manipulation;
  transform-origin: center;
}

.buttons .yes {
  position: relative;
  z-index: 2;
  flex: 0 0 auto;
  max-width: none;
  transition:
    width .3s ease,
    height .3s ease,
    flex-basis .3s ease,
    font-size .3s ease,
    border-radius .3s ease,
    box-shadow .15s ease;
}

.buttons .no {
  position: relative;
  z-index: 5;
  flex: 1 1 0;
  width: auto;
  height: auto;
  min-height: 48px;
  max-width: none;
  aspect-ratio: auto;
  padding: 0 8px;
  transform: none;
  transition:
    left .24s ease,
    top .24s ease,
    box-shadow .15s ease;
}

/* 第一阶段交换按钮位置 */
.buttons.swapped .yes { order: 2; }
.buttons.swapped .no { order: 1; }

/* 第二、三阶段：不要按钮脱离排版，不会被和好按钮挤变形 */
.buttons.growing {
  gap: 12px;
  align-items: center;
  overflow: hidden;
}

.buttons.growing .yes {
  flex: 0 0 auto;
  max-width: none;
  z-index: 2;
}

.buttons.growing .no {
  position: absolute;
  flex: 0 0 auto;
  width: var(--no-width, 90px);
  height: var(--no-height, 60px);
  min-height: 0;
  max-width: none;
  aspect-ratio: 3 / 2;
  z-index: 5;
  transform: none;
}

.no.running-away:active {
  transform: none;
}

@media (max-width: 380px) {
  .buttons {
    gap: 8px;
    margin-top: 16px;
  }

  .btn {
    min-height: 46px;
    font-size: 14px;
    padding: 8px 5px;
  }

  .buttons .no {
    width: 78px;
    height: 52px;
    min-height: 0;
  }

  .buttons.growing .no {
    width: var(--no-width, 78px);
    height: var(--no-height, 52px);
  }
}

/* ===== 修复按钮初始尺寸、渐进移动与重叠 ===== */

/* 初始状态：两个按钮尺寸一致，保持原来的并排布局 */
.buttons:not(.growing) .yes,
.buttons:not(.growing) .no {
  flex: 1 1 0;
  width: auto;
  height: auto;
  min-height: 48px;
}

/* 增长状态：按钮在原位置上移动，不重新排列 */
.buttons.growing {
  position: relative;
  display: block;
  gap: 0;
  overflow: hidden;
  isolation: isolate;
}

.buttons.growing .yes,
.buttons.growing .no {
  position: absolute;
  margin: 0;
  flex: 0 0 auto;
  max-width: none;
  transition:
    left .3s ease,
    top .3s ease,
    width .3s ease,
    height .3s ease,
    font-size .3s ease,
    box-shadow .15s ease;
}

.buttons.growing .yes {
  z-index: 2;
}

.buttons.growing .no {
  z-index: 5;
  transform: none;
}
  
</style>
</head>
<body>
<main class="app">
<div class="top">
  <span></span>

</div>

  <h1>姐姐，可以跟我和好吗？</h1>

  ["没有你的日子真的好难过……", "sad", "🐶"],
  ["真的不再考虑一下吗？", "shy", "🐶"],
  ["求求你给我一次机会，我会改的！", "sad", "🐶"]
];

const scene = document.getElementById("scene");
const pet = document.getElementById("pet");
const message = document.getElementById("message");
const buttons = document.getElementById("buttons");
const footer = document.getElementById("footer");
const app = document.querySelector(".app");

let yes = document.getElementById("yes");
let no = document.getElementById("no");

let stageIndex = 0;
let itemIndex = 0;
let finalIndex = 0;
let phase = "opening";

/* 记录当前正在展示的文案属于哪个阶段 */
let displayedStageIndex = -1;

/* 每个阶段点击“不要”的次数 */
let stageNoClicks = [0, 0, 0, 0];

/* 图片文件 */
const emojiImages = {
  cute: ["1.gif", "2.gif", "3.gif", "4.gif", "5.gif"],
  love: [
    "1.gif", "2.png", "3.gif", "4.png",
    "5.png", "6.png", "7.png", "8.gif"
  ],
  mad: ["1.gif"],
  sad: [
    "1.gif", "2.gif", "3.gif", "4.png",
    "5.gif", "6.gif", "7.png", "8.gif", "9.gif"
  ],
  good: ["1.gif"]
};

let lastEmoji = "";
const imageCache = new Map();
let imageRequestId = 0;

/* 预加载所有图片，尽可能减少切换时的空白 */
function preloadImages() {
  Object.entries(emojiImages).forEach(([folder, files]) => {
    files.forEach(file => {
      const path = `emoji/${folder}/${file}`;

      if (!imageCache.has(path)) {
        const img = new Image();
        img.src = path;
        imageCache.set(path, img);
      }
    });
  });
}

preloadImages();

/* 选择随机图片，尽量避免连续重复 */
function randomEmoji(folder) {
  const files = emojiImages[folder] || emojiImages.cute;

  let candidates = files.filter(file =>
    files.length === 1 || `emoji/${folder}/${file}` !== lastEmoji
  );

  if (!candidates.length) candidates = files;

  const file = candidates[Math.floor(Math.random() * candidates.length)];
  lastEmoji = `emoji/${folder}/${file}`;

  return lastEmoji;
}

function chooseEmojiFolder(text, mood) {
  if (mood === "good") return "good";
  if (mood === "mad") return "mad";

  if (/吃醋|生气|不理你|嫌我烦|闹脾气/.test(text)) {
    return "mad";
  }

  if (
    mood === "love" ||
    /喜欢你|I LOVE YOU|接住你的眼泪|依赖我|重新开始|舍不得离开我/.test(text)
  ) {
    return "love";
  }

  if (
    mood === "sad" ||
    mood === "cry" ||
    /对不起|我错了|伤心|难过|求求你|不要推开我|好痛/.test(text)
  ) {
    return "sad";
  }

  return "cute";
}

/*
 * 图片切换策略：
 * 先加载新图，成功后才替换旧图。
 * 如果新图还没加载好，上一张图会继续显示。
 * 快速连续点击时，只采用最后一次请求的图片。
 */
function setPetImage(path) {
  const requestId = ++imageRequestId;

  let img = imageCache.get(path);

  if (!img) {
    img = new Image();
    img.src = path;
    imageCache.set(path, img);
  }

  function applyImage() {
    if (requestId !== imageRequestId) return;

    const displayImg = document.createElement("img");
    displayImg.alt = "小动物表情";
    displayImg.draggable = false;
    displayImg.decoding = "async";
    displayImg.src = path;

    pet.replaceChildren(displayImg);
  }

  if (img.complete && img.naturalWidth > 0) {
    applyImage();
    return;
  }

  img.addEventListener("load", applyImage, { once: true });

  img.addEventListener("error", () => {
    if (requestId !== imageRequestId) return;
    // 新图加载失败时不清除旧图
  }, { once: true });
}

function show(text, mood = "cute", emoji = "🐶") {
  message.textContent = text;
  scene.className = "scene " + mood;

  const folder = chooseEmojiFolder(text, mood);
  const imagePath = randomEmoji(folder);

  setPetImage(imagePath);

  if (mood === "happy" || mood === "love" || mood === "good") {
    hearts(3);
  }
}

function hearts(count = 2) {
  const symbols = ["♡", "♥", "✦", "💕"];

  for (let i = 0; i < count; i++) {
    const el = document.createElement("span");
    el.className = "float-heart";
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = (20 + Math.random() * 60) + "vw";
    el.style.top = (50 + Math.random() * 35) + "vh";

    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1900);
  }
}


/* ===== 按钮尺寸与位置：跨阶段累积 ===== */
let yesGrowth = 0;
let yesBaseWidth = 0;
let yesBaseHeight = 0;

let noBaseWidth = 0;
let noBaseHeight = 0;

let yesStartX = null;
let yesStartY = null;
let noStartX = null;
let noStartY = null;
let noMoveDistance = 0;

function initializeYesSize() {
  if (!yes || !no || !buttons) return;

  // 只在初始布局下记录尺寸，确保两个按钮最初大小一致
  if (!yesBaseWidth || !yesBaseHeight) {
    const yesRect = yes.getBoundingClientRect();
    yesBaseWidth = yesRect.width;
    yesBaseHeight = yesRect.height;
  }

  if (!noBaseWidth || !noBaseHeight) {
    const noRect = no.getBoundingClientRect();
    noBaseWidth = noRect.width;
    noBaseHeight = noRect.height;
  }

  if (yesGrowth > 0) {
    applyYesGrowth();
  }
}

/* 和好按钮逐次增大，并逐渐向按钮区域中央移动 */
function applyYesGrowth() {
  if (!yes || !no || !buttons || !yesBaseWidth || !yesBaseHeight) return;

  const targetWidth = yesBaseWidth + yesGrowth * 14;
  const targetHeight = yesBaseHeight + yesGrowth * 22;

  yes.style.width = `${targetWidth}px`;
  yes.style.height = `${targetHeight}px`;
  yes.style.minHeight = `${targetHeight}px`;
  yes.style.maxWidth = "none";
  yes.style.maxHeight = "none";
  yes.style.flex = `0 0 ${targetWidth}px`;
  yes.style.fontSize = `${Math.min(15 + yesGrowth * 0.5, 22)}px`;
  yes.style.zIndex = "2";

  no.style.zIndex = "5";

  if (buttons.classList.contains("growing")) {
    // 每次只向中央靠近一小段，不突然跳到中央
    const centerX = Math.max(0, (buttons.clientWidth - targetWidth) / 2);

    if (yesStartX === null) yesStartX = 0;

    yesStartX += (centerX - yesStartX) * 0.35;

    yes.style.left = `${yesStartX}px`;
    yes.style.top = `${yesStartY}px`;

    // 增大按钮区域高度，但不改变气泡的位置
    buttons.style.minHeight = `${Math.max(52, targetHeight)}px`;
  }
}

/* 第一次进入增长阶段时记录两个按钮各自的原始位置 */
function prepareNoButtonPosition() {
  if (!yes || !no || !buttons) return;

  const buttonsRect = buttons.getBoundingClientRect();
  const yesRect = yes.getBoundingClientRect();
  const noRect = no.getBoundingClientRect();

  if (yesStartX === null) {
    yesStartX = yesRect.left - buttonsRect.left;
    yesStartY = yesRect.top - buttonsRect.top;
  }

  if (noStartX === null) {
    noStartX = noRect.left - buttonsRect.left;
    noStartY = noRect.top - buttonsRect.top;
  }

  if (!noBaseWidth) noBaseWidth = noRect.width;
  if (!noBaseHeight) noBaseHeight = noRect.height;

  // 不要按钮独立保留自己的尺寸，不跟随和好按钮变高
  no.style.width = `${noBaseWidth}px`;
  no.style.height = `${noBaseHeight}px`;
  no.style.minHeight = `${noBaseHeight}px`;
  no.style.boxSizing = "border-box";
  no.style.flex = "0 0 auto";
  no.style.position = "absolute";
  no.style.left = `${noStartX}px`;
  no.style.top = `${noStartY}px`;
  no.style.zIndex = "5";
}

/* 重置按钮：跨阶段时保留增长与位置 */
function resetButtonEffects() {
  yes = document.getElementById("yes");
  no = document.getElementById("no");

  if (!yes || !no || !buttons) return;

  // 保留整个道歉阶段的按钮位置，避免进入新文案时突然归位
  const preserveGrowth =
    phase === "apology" &&
    stageIndex >= 1 &&
    stageIndex <= 3 &&
    yesGrowth > 0;

  if (preserveGrowth) {
    buttons.classList.add("growing");
    return;
  }

  buttons.classList.remove("swapped", "growing");

  yes.style.position = "";
  yes.style.left = "";
  yes.style.top = "";
  yes.style.width = "";
  yes.style.height = "";
  yes.style.minHeight = "";
  yes.style.maxWidth = "";
  yes.style.maxHeight = "";
  yes.style.flex = "";
  yes.style.fontSize = "";
  yes.style.zIndex = "";

  no.style.position = "";
  no.style.left = "";
  no.style.top = "";
  no.style.width = "";
  no.style.height = "";
  no.style.minHeight = "";
  no.style.maxWidth = "";
  no.style.maxHeight = "";
  no.style.flex = "";
  no.style.transform = "";
  no.style.zIndex = "";
  no.style.removeProperty("--no-width");
  no.style.removeProperty("--no-height");

  yesGrowth = 0;
  yesBaseWidth = 0;
  yesBaseHeight = 0;
  noBaseWidth = 0;
  noBaseHeight = 0;

  yesStartX = null;
  yesStartY = null;
  noStartX = null;
  noStartY = null;
  noMoveDistance = 0;

  buttons.style.minHeight = "";
  buttons.style.height = "";
}

/* 第一阶段第三次点击“不要”时交换按钮位置；
   第二、三阶段持续增长并逐渐移动，第四阶段继续保留重叠 */
function updateStageButtonEffects(stage) {
  if (!yes || !no || !buttons) return;

  if (stage === 0 && stageNoClicks[0] >= 3) {
    buttons.classList.add("swapped");
    return;
  }

  if (stage === 1 || stage === 2) {
    if (!buttons.classList.contains("growing")) {
      prepareNoButtonPosition();
      buttons.classList.add("growing");

      yes.style.position = "absolute";
      yes.style.left = `${yesStartX}px`;
      yes.style.top = `${yesStartY}px`;

      no.style.left = `${noStartX}px`;
      no.style.top = `${noStartY}px`;
    }

    yesGrowth += 1;
    applyYesGrowth();

    // 不要按钮只在有空间时横向移动，到边界就停下
    const maxX = Math.max(0, buttons.clientWidth - noBaseWidth);
    const nextX = noStartX + noMoveDistance + 12;

    if (nextX <= maxX) {
      noMoveDistance += 12;
    } else {
      noMoveDistance = Math.max(0, maxX - noStartX);
    }

    no.style.left = `${noStartX + noMoveDistance}px`;
    no.style.top = `${noStartY}px`;
    no.style.zIndex = "5";
  }
}

/* 第四阶段：不要按钮在和好按钮内部或周围移动 */
function moveNoTowardYes() {
  if (!yes || !no || !buttons) return;


  applyYesGrowth();

  // 获取不要按钮原始尺寸
  const noRect = no.getBoundingClientRect();
  const buttonWidth = noRect.width;
  const buttonHeight = noRect.height;

  // 不要按钮改为在按钮区域内绝对定位
  no.style.position = "absolute";
  no.style.width = `${buttonWidth}px`;
  no.style.height = `${buttonHeight}px`;
  no.style.minHeight = `${buttonHeight}px`;
  no.style.maxWidth = "100%";
  no.style.flex = "none";
  no.style.transform = "none";
  no.style.zIndex = "5";

  const yesRect = yes.getBoundingClientRect();
  const buttonsRect = buttons.getBoundingClientRect();

  // 转换成按钮区域内的坐标
  const maxX = Math.max(0, buttons.clientWidth - buttonWidth);
  const maxY = Math.max(0, buttons.clientHeight - buttonHeight);

  // 在和好按钮附近移动，可以重叠，但不能越界
  const centerX =
    yesRect.left - buttonsRect.left + yesRect.width / 2 - buttonWidth / 2;

  const centerY =
    yesRect.top - buttonsRect.top + yesRect.height / 2 - buttonHeight / 2;

  const radius = Math.max(
    0,
    Math.min(yesRect.width, yesRect.height) * 0.35
  );

  const angle = Math.random() * Math.PI * 2;
  const distance = Math.random() * radius;

  const targetX = centerX + Math.cos(angle) * distance;
  const targetY = centerY + Math.sin(angle) * distance;

  no.style.left = `${Math.max(0, Math.min(maxX, targetX))}px`;
  no.style.top = `${Math.max(0, Math.min(maxY, targetY))}px`;
}

  
/* 最终阶段：不要按钮在整个屏幕范围内躲避 */
let dodgeSpeed = 0.7;
const maxDodgeSpeed = 5.5;
let dodgeX = 0;
let dodgeY = 0;
let dodgeTargetX = 0;
let dodgeTargetY = 0;
let dodgeFrame = null;
let dodgeActive = false;

function startDodgeMode() {
  if (!no || !buttons) return;

  dodgeActive = true;
  dodgeSpeed = 0.7;

  no.classList.add("running-away");
  no.style.position = "fixed";
  no.style.zIndex = "9999";
  no.style.width = Math.min(150, window.innerWidth * 0.4) + "px";
  no.style.flex = "none";
  no.style.left = "0px";
  no.style.top = "0px";
  no.style.transform = "none";

  const rect = no.getBoundingClientRect();
  dodgeX = rect.left;
  dodgeY = rect.top;

  chooseDodgeTarget();
  animateDodge();
}

function chooseDodgeTarget() {
  if (!no || !dodgeActive) return;

  const margin = 8;
  const maxX = Math.max(margin, window.innerWidth - no.offsetWidth - margin);
  const maxY = Math.max(margin, window.innerHeight - no.offsetHeight - margin);

  dodgeTargetX = margin + Math.random() * (maxX - margin);
  dodgeTargetY = margin + Math.random() * (maxY - margin);
}

function animateDodge() {
  if (!dodgeActive || !no) return;

  const dx = dodgeTargetX - dodgeX;
  const dy = dodgeTargetY - dodgeY;
  const distance = Math.hypot(dx, dy);

  if (distance < 2) {
    chooseDodgeTarget();
  } else {
    dodgeX += (dx / distance) * Math.min(dodgeSpeed, distance);
    dodgeY += (dy / distance) * Math.min(dodgeSpeed, distance);
  }

  const maxX = Math.max(0, window.innerWidth - no.offsetWidth);
  const maxY = Math.max(0, window.innerHeight - no.offsetHeight);

  dodgeX = Math.max(0, Math.min(maxX, dodgeX));
  dodgeY = Math.max(0, Math.min(maxY, dodgeY));

  no.style.left = dodgeX + "px";
  no.style.top = dodgeY + "px";

  dodgeFrame = requestAnimationFrame(animateDodge);
}

function stopDodgeMode() {
  dodgeActive = false;

  if (dodgeFrame !== null) {
    cancelAnimationFrame(dodgeFrame);
    dodgeFrame = null;
  }

  if (no) {
    no.classList.remove("running-away");
    no.style.position = "";
    no.style.zIndex = "";
    no.style.width = "";
    no.style.flex = "";
    no.style.left = "";
    no.style.top = "";
    no.style.transform = "";
  }
}

/* 移动设备方向或尺寸变化时，重新限制按钮范围 */
window.addEventListener("resize", () => {
  if (!dodgeActive || !no) return;

  const maxX = Math.max(0, window.innerWidth - no.offsetWidth);
  const maxY = Math.max(0, window.innerHeight - no.offsetHeight);

  dodgeX = Math.min(dodgeX, maxX);
  dodgeY = Math.min(dodgeY, maxY);
  dodgeTargetX = Math.min(dodgeTargetX, maxX);
  dodgeTargetY = Math.min(dodgeTargetY, maxY);
});

function showQuestion(finalQuestion = false) {
  stopDodgeMode();
  resetButtonEffects();
  initializeYesSize();

  phase = finalQuestion ? "finalQuestion" : "opening";

  show("可以跟我和好吗？🥺", "shy", "🐶");

  yes.textContent = "♡ 和好 ♡";
  no.textContent = finalQuestion ? "真的不要" : "不要";

  buttons.classList.remove("hidden");
  footer.textContent = "再给小狗一次机会嘛…… ♡";
}

function nextApology() {
  while (
    stageIndex < stages.length &&
    itemIndex >= stages[stageIndex].items.length
  ) {
    stageIndex++;
    itemIndex = 0;

    if (stageIndex < stages.length) {
      resetButtonEffects();
    }
  }

  if (stageIndex >= stages.length) {
    showQuestion(true);
    return;
  }

  phase = "apology";
  displayedStageIndex = stageIndex;

  const item = stages[stageIndex].items[itemIndex];
  itemIndex++;

  show(item[0], item[1], item[2]);

  if (
    stageIndex === stages.length - 1 &&
    itemIndex === stages[stageIndex].items.length
  ) {
    footer.textContent = "小狗还在努力想办法…… ♡";
  }
}

function nextFinal() {
  if (finalIndex < finalItems.length) {
    const item = finalItems[finalIndex];
    finalIndex++;

    phase = "final";
    show(item[0], item[1], item[2]);

    /*
     * 最终拒绝阶段开始躲避。
     * 速度每次拒绝后增加，但不会超过上限。
     */
    startDodgeMode();

    if (finalIndex === finalItems.length) {
      footer.textContent = "最后一次机会了……真的不抱抱吗？";
    }

    return;
  }

  phase = "loop";
  show("好吧，我放弃了…但我会一直等你的！", "sad", "🐶");
  footer.textContent = "你点多少次，小狗就等多少次。♡";
  no.textContent = "还是不要";

  startDodgeMode();
}

function makeUp() {
  stopDodgeMode();
  phase = "ending";

  show(
    "我就知道你最好了！喜欢你🫶🏻！\n\n" +
    "让我们重新开始吧！🥹💕\n\n" +
    "mua ～ ( ˶ˆᗜˆ˵ ) ♡",
    "good"
  );

  buttons.innerHTML =
    '<button class="btn yes" id="restart">♡ 再抱一次 ♡</button>';

  document.getElementById("restart").addEventListener("click", restart);

  footer.textContent = "LOVE YOU ♡";

  hearts(16);
}

function restart() {
  stopDodgeMode();

  stageIndex = 0;
  itemIndex = 0;
  finalIndex = 0;
  displayedStageIndex = -1;
  stageNoClicks = [0, 0, 0, 0];
  yesGrowth = 0;
  yesBaseWidth = 0;
  yesBaseHeight = 0;
  noBaseWidth = 0;
noBaseHeight = 0;
noStartX = null;
noStartY = null;
noMoveDistance = 0;
  dodgeSpeed = 0.7;

  buttons.innerHTML =
    '<button class="btn yes" id="yes">♡ 和好 ♡</button>' +
    '<button class="btn no" id="no">不要</button>';

  yes = document.getElementById("yes");
  no = document.getElementById("no");

  showQuestion(false);
}

function refuse() {
  if (phase === "opening") {
    stageIndex = 0;
    itemIndex = 0;
    nextApology();
    return;
  }

  if (phase === "apology") {
    const currentStage = displayedStageIndex;

    if (currentStage >= 0 && currentStage < stages.length) {
      stageNoClicks[currentStage]++;

      if (currentStage === 0) {
        updateStageButtonEffects(0);
      }

      if (currentStage === 1 || currentStage === 2) {
        updateStageButtonEffects(currentStage);
      }

      if (currentStage === 3) {
        moveNoTowardYes();
      }
    }

    nextApology();
    return;
  }

  if (phase === "finalQuestion") {
    finalIndex = 0;
    dodgeSpeed = 0.7;
    nextFinal();
    return;
  }

  if (phase === "final") {
    dodgeSpeed = Math.min(dodgeSpeed + 0.45, maxDodgeSpeed);
    nextFinal();
    return;
  }

  if (phase === "loop") {
    dodgeSpeed = Math.min(dodgeSpeed + 0.45, maxDodgeSpeed);
    show("好吧，我放弃了…但我会一直等你的！", "sad", "🐶");
    hearts(2);
    return;
  }

  if (phase === "ending") {
    restart();
  }
}

/* 用事件委托，避免和好结局重建按钮后旧引用失效 */
buttons.addEventListener("click", event => {
  const target = event.target.closest("button");
  if (!target) return;

  if (target.id === "yes") {
    makeUp();
  } else if (target.id === "no") {
    refuse();
  }
});

/* 初始显示 */
showQuestion(false);
</script>
