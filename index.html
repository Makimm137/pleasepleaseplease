
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#ffe5f0">
<title>姐姐，可以跟我和好吗？♡</title>
<style>
:root {
  --pink: #ffb8d2;
  --deep: #e979a5;
  --light: #fff4f8;
  --ink: #80576b;
  --pixel: 4px;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background-color: #ffe8f1;
  background-image:
    linear-gradient(45deg,#fbd6e5 25%,transparent 25%),
    linear-gradient(-45deg,#fbd6e5 25%,transparent 25%),
    linear-gradient(45deg,transparent 75%,#fbd6e5 75%),
    linear-gradient(-45deg,transparent 75%,#fbd6e5 75%);
  background-size: 28px 28px;
  color: var(--ink);
  font-family: "Courier New", "Microsoft YaHei", sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 18px 12px;
  overflow-x: hidden;
}
button { font: inherit; -webkit-tap-highlight-color: transparent; }
.app {
  position: relative;
  width: 100%;
  max-width: 440px;
  min-height: 610px;
  background: rgba(255,250,252,.96);
  border: 4px solid white;
  outline: 2px solid #f2a4c3;
  box-shadow: 7px 7px 0 #eeb1ca;
  padding: 20px 17px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  overflow: hidden;
}
.top {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11px;
  letter-spacing: 1px;
  color: #d17d9f;
}
.pixel-heart { font-size: 18px; animation: beat 1s steps(2) infinite; }
h1 {
  margin: 20px 0 0;
  font-size: clamp(19px,5.5vw,25px);
  line-height: 1.5;
  color: #d85f92;
  text-shadow: 2px 2px #ffe0eb;
}
.subtitle { font-size: 11px; margin-top: 7px; color: #c58da5; }
.stage {
  margin-top: 13px;
  border: 1px dashed #eeb0c8;
  padding: 5px 11px;
  font-size: 10px;
  color: #cf7299;
  background: #fff0f6;
}
.scene {
  width: 100%;
  min-height: 190px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  margin: 12px 0 2px;
}
.sparkle {
  position: absolute;
  color: #f19abd;
  font-size: 23px;
  animation: twinkle 1.5s steps(2) infinite;
}
.s1 { top: 22px; left: 15%; }
.s2 { top: 43px; right: 13%; animation-delay: .4s; }
.s3 { bottom: 20px; left: 22%; animation-delay: .8s; }
.s4 { bottom: 25px; right: 19%; }
.pet {
  position: relative;
  font-family: sans-serif;
  font-size: 108px;
  line-height: 1.25;
  filter: drop-shadow(3px 5px 0 #f7c5d9);
  transform-origin: 50% 85%;
  animation: idle 1.5s ease-in-out infinite;
  z-index: 1;
  user-select: none;
}
.pet::after {
  content: "♡";
  position: absolute;
  font-size: 27px;
  color: #ed80aa;
  top: -5px;
  right: -4px;
  animation: beat .8s steps(2) infinite;
}
.scene.sad .pet { animation: sad 1.3s ease-in-out infinite; }
.scene.cry .pet { animation: cry 1.1s ease-in-out infinite; }
.scene.happy .pet { animation: happy .65s ease-in-out infinite; }
.scene.tease .pet { animation: tease 1.1s ease-in-out infinite; }
.scene.shy .pet { animation: shy 1.4s ease-in-out infinite; }
.scene.love .pet { animation: happy .7s ease-in-out infinite; }
.scene.hug .pet { animation: hug .9s ease-in-out infinite; }
.scene.hug .pet::after { content: "♥"; }
.pair {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 0;
  font-size: 82px;
  line-height: 1.2;
  filter: drop-shadow(3px 4px 0 #f7c5d9);
}
.scene.hug .pet { display: none; }
.scene.hug .pair { display: flex; animation: hug .9s ease-in-out infinite; }
.speech {
  width: 100%;
  position: relative;
  background: white;
  border: 2px solid #f2a4c3;
  box-shadow: 3px 3px 0 #f9d0e0;
  border-radius: 15px;
  padding: 17px 15px;
  min-height: 112px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.speech::before {
  content: "";
  position: absolute;
  top: -9px;
  left: calc(50% - 7px);
  width: 12px;
  height: 12px;
  background: white;
  border-top: 2px solid #f2a4c3;
  border-left: 2px solid #f2a4c3;
  transform: rotate(45deg);
}
#message {
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.95;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  transition: opacity .16s ease;
}
.buttons {
  width: 100%;
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-top: 19px;
}
.btn {
  flex: 1;
  min-height: 48px;
  border: 0;
  cursor: pointer;
  border-radius: 8px;
  font-weight: bold;
  font-size: 15px;
  transition: transform .15s, box-shadow .15s;
}
.btn:active { transform: translateY(3px); box-shadow: none; }
.yes {
  color: white;
  background: #f18bb3;
  box-shadow: 0 4px 0 #d96c99;
}
.no {
  color: #bc7793;
  background: #ffe5ef;
  border: 2px solid #f5b5cd;
  box-shadow: 0 4px 0 #efc2d4;
}
.progress {
  margin-top: 17px;
  width: 100%;
  height: 7px;
  background: #ffe5ef;
  border: 1px solid #f7c2d6;
  padding: 1px;
}
#bar {
  height: 100%;
  width: 0;
  background: repeating-linear-gradient(
    90deg,#ed8db4 0 8px,#f8b7d0 8px 12px
  );
  transition: width .3s;
}
.footer { font-size: 10px; color: #d39bb1; margin-top: 12px; }
.paws { margin-top: 8px; letter-spacing: 7px; font-size: 13px; opacity: .65; }
.float-heart {
  position: fixed;
  pointer-events: none;
  z-index: 10;
  animation: floatUp 1.8s ease-out forwards;
}
.hidden { display: none !important; }
@keyframes idle {
  0%,100% { transform: translateY(0) rotate(0); }
  50% { transform: translateY(-7px) rotate(-3deg); }
}
@keyframes sad {
  0%,100% { transform: translateY(3px) rotate(-5deg); }
  50% { transform: translateY(8px) rotate(5deg); }
}
@keyframes cry {
  0%,100% { transform: translateY(0) rotate(-7deg); }
  50% { transform: translateY(6px) rotate(7deg); }
}
@keyframes happy {
  0%,100% { transform: translateY(0) scale(1) rotate(-5deg); }
  50% { transform: translateY(-14px) scale(1.06) rotate(5deg); }
}
@keyframes tease {
  0%,100% { transform: rotate(-8deg); }
  50% { transform: rotate(8deg); }
}
@keyframes shy {
  0%,100% { transform: scale(1) rotate(0); }
  50% { transform: scale(.95) rotate(-5deg); }
}
@keyframes hug {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.08) translateY(-5px); }
}
@keyframes beat {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}
@keyframes twinkle {
  0%,100% { opacity: .45; transform: scale(.8); }
  50% { opacity: 1; transform: scale(1.2); }
}
@keyframes floatUp {
  0% { opacity: 1; transform: translateY(0) scale(.7) rotate(0); }
  100% { opacity: 0; transform: translateY(-150px) scale(1.5) rotate(20deg); }
}
@media(max-width:380px) {
  .app { padding: 15px 12px 13px; min-height: 580px; }
  .scene { min-height: 165px; }
  .pet { font-size: 92px; }
  #message { font-size: 14px; }
  .speech { padding: 14px 11px; }
}
@media(prefers-reduced-motion:reduce) {
  *,*::before,*::after { animation-duration: 2s !important; }
}

/* ===== 气泡自适应文字高度 ===== */
.speech {
  width: 100%;
  position: relative;
  background: white;
  border: 2px solid #f2a4c3;
  box-shadow: 3px 3px 0 #f9d0e0;
  border-radius: 15px;
  padding: 14px 15px;
  min-height: 0;
  height: auto;
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: visible;
}

.speech::before {
  content: "";
  position: absolute;
  top: -9px;
  left: calc(50% - 7px);
  width: 12px;
  height: 12px;
  background: white;
  border-top: 2px solid #f2a4c3;
  border-left: 2px solid #f2a4c3;
  transform: rotate(45deg);
}

#message {
  width: 100%;
  margin: 0;
  font-family: "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.8;
  overflow-wrap: anywhere;
  word-break: normal;
  white-space: pre-wrap;
  text-align: center;
}

/* 页面高度也跟随内容变化 */
.app {
  min-height: 0;
  height: auto;
}

/* 小屏幕手机适配 */
@media (max-width: 380px) {
  .speech {
    padding: 12px 10px;
  }

  #message {
    font-size: 14px;
    line-height: 1.8;
  }

  .app {
    min-height: 0;
    height: auto;
    padding: 15px 12px 13px;
  }
}
  
/* ===== 使用 emoji 文件夹中的真实动图 ===== */
.pet {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 180px;
  font-size: 0;
  line-height: normal;
  filter: none;
  animation: none;
  transform: none;
  user-select: none;
}

.pet::after {
  content: none;
}

.pet img {
  display: block;
  width: 100%;
  height: 180px;
  object-fit: contain;
  image-rendering: auto;
  animation: none;
}

/* 图片结局不再显示原来的 emoji 拥抱 */
.scene.hug .pet {
  display: flex;
}

.scene.hug .pair {
  display: none;
}

@media (max-width: 380px) {
  .pet,
  .pet img {
    height: 155px;
  }
}

</style>
</head>
<body>
<main class="app">
<div class="top">
  <span></span>
  <span class="pixel-heart">♥</span>
</div>

  <h1>姐姐，可以跟我和好吗？</h1>


  <div class="scene" id="scene">
    <span class="sparkle s1">✦</span>
    <span class="sparkle s2">♡</span>
    <span class="sparkle s3">✧</span>
    <span class="sparkle s4">♥</span>
    <div class="pet" id="pet" aria-label="可爱的小狗">🐶</div>
    <div class="pair" id="pair" aria-label="两只小动物抱在一起">🐶💗🐱</div>
  </div>

  <div class="speech">
    <div id="message">可以跟我和好吗？🥺</div>
  </div>

  <div class="buttons" id="buttons">
    <button class="btn yes" id="yes">♡ 和好 ♡</button>
    <button class="btn no" id="no">不要</button>
  </div>


  <div class="footer" id="footer">小狗的爱意正在加载…… ♡</div>
  <div class="paws">🐾 ♡ 🐾 ♡ 🐾</div>
</main>


<script>
const stages = [
  {
    items: [
      ["对不起姐姐，我错了呜呜呜🥺 姐姐可以凶凶我，可以骂骂我，但千万不要推开我呜呜呜", "cry", "🐶"],
      ["姐姐的想法对我来说真的很重要，我也会努力学着多考虑你的感受，而不是只顾着自己想要什么", "sad", "🐶"],
      ["我确实很想跟姐姐睡在一起，有时候也会因为想跟姐姐待在一起而有一点贪心，忍不住想再争取一下。但我不是不在乎姐姐呀，明明就是因为很喜欢姐姐，才会这么舍不得嘛……(｡•́︿•̀｡)", "shy", "🐶"],
      ["不过我也会慢慢学着好好表达自己的想法，而不是非要姐姐答应我才肯罢休。‼️姐姐真的在学习、需要独处或者不想被打扰的时候，我一定一定会好好听话，不去打扰姐姐！(๑•̀ㅂ•́)و✧", "happy", "🐶"],
      ["我知道姐姐最近学习很累，有很多自己的事情要忙，我也很想为姐姐做点什么呀，如果姐姐累了，我可以给姐姐按摩，听你说说话，骂骂街，或者什么都不做都好。不想让姐姐还要为照顾我的情绪感到负担。姐姐不管是开心、生气还是难过，都可以在我面前做最真实的自己，不用顾虑我太多。", "love", "🐶"],
      ["其实……我也想让姐姐多依赖我一些嘛。૮ ˶ᵔ ᵕ ᵔ˶ ა", "shy", "🐶"],
      ["姐姐向我展现依赖的时候，或者在脆弱、难过的时候愿意来找我寻求安慰的时候，我真的会特别开心🎆💕 姐姐可能都不知道，我其实一直很希望你能在我面前展现这样的情绪。", "love", "🐶"],
      ["因为对我来说，姐姐愿意依赖我，也是一种信任呀。我也想多了解一些姐姐。你不用永远那么坚强，也不用担心自己的负面情绪会给我带来负担。只要姐姐没有真的讨厌我，我就还是会很喜欢姐姐，还是会想黏着姐姐，像鬼一样缠着你不放的！👻💗 ( ˶ˆᗜˆ˵ )（摇尾巴）（蹭蹭）（开心）🫶🏻", "happy", "🐶"]
    ]
  },
  {
    items: [
      ["我知道错了，要不然你咬我一下，消消气૮⁔. ̫ .⁔ა . ⁺ . ✦", "shy", "🐶"],
      ["你拍拍我，拍我一下就相当于打我一下，啊，好痛！", "cry", "🐶"],
      ["臣罪该万死！", "sad", "🐶"],
      ["吾日三省吾身。", "shy", "🐶"],
      ["主人不要和小狗一般见识！", "sad", "🐶"],
      ["都是我那该死的脾气惹的祸，我一定狠狠收拾它，所以原谅我好吗？", "cry", "🐶"],
      ["有一天小熊在洗衣服，可是有一个地方怎么洗也洗不干净。熊妈妈说：“你认真搓。”小熊红着眼睛说：“我搓了啦，我搓了啦。”你听见了吗？我错了！", "tease", "🐻"],
      ["有一天小鸭子在看书，另一只小鸭子说吃饭了。快把书和好鸭！合好鸭！合好鸭！", "tease", "🐥"],
      ["有天兔子种了一颗草莓和芒果，发现草莓长得好慢，兔兔就说：莓你不行，莓你不行！", "tease", "🐰"],
      ["我今天去买油了，你猜什么油哦？I LOVE YOU！！！", "love", "🐶"],
      ["爱学习的小猪最美丽！", "happy", "🐷"]
    ]
  },
  {
    items: [
      ["我给你买好吃的！你想吃什么呀？", "happy", "🐶"],
      ["喜欢什么颜色的毛爷爷？", "tease", "🐶"],
      ["我收藏了很多拍照攻略给姐姐美美出片！", "love", "🐶"],
      ["我存在的意义就是为了接住你的眼泪，让你可以不那么勇敢。不管发生什么事，我都会一直陪着你的。明明你脆弱一点也没关系。", "love", "🐶"],
      ["总想做点什么，让你舍不得离开我。后来才发现，其实是我舍不得你，所以才想做点什么。", "sad", "🐶"]
    ]
  },
  {
    items: [
      ["为什么被子可以抱你？我吃醋了！为什么枕头可以摸你头？我吃醋了！为什么筷子可以亲你？我吃醋了！", "tease", "🐶"],
      ["我就是要黏着你啊！没错，我就是粘人精！如果你不让我黏，我会化成一滩水蒸发掉……我要变成一粒米饭疯狂黏你，不小心被你吃掉也没关系！我是狗皮膏药，我是黏鼠板，就算把我撕扯下来也会有我附着过的痕迹。休想把我甩掉……干嘛嫌我烦啊，我只是很喜欢你才找你聊天。如果这样的话，那我只能悲伤地黏着你了！", "happy", "🐶"],
      ["姐姐生气了，我尾巴摇断了你都不笑一下？那我翻肚皮给你看，再不行我就哭，我哭功一流的😭", "cry", "🐶"],
      ["我给你表演一个杂技\n🍊         🍊\n🍊           🍊\n 🍊           🍊\n🍊            🍊\n🍊            🍊\n🍊            🍊\n╰( ꒦ິᯅ꒦ີ )╯\n快接一下要掉了😭", "tease", "🐶"]
    ]
  }
];

const finalItems = [
  ["中嫩真中，发消息嫩不回嫩真是冷酷的银！俺马上走让嫩看不着！俺骑上俺的小三轮！像俺这样的银，果然消失都中！别说了保安俺也辞了！俺能想到嫩多欢喜……就这样吧，俺对嫩死心了！", "cry", "🐶"],
  ["哼！那我也不理你了！", "tease", "🐶"],
  ["我真的很伤心……", "cry", "🐶"],
  ["没有你的日子真的好难过……", "sad", "🐶"],
  ["真的不再考虑一下吗？", "shy", "🐶"],
  ["求求你给我一次机会，我会改的！", "sad", "🐶"]
];

const scene = document.getElementById("scene");
const pet = document.getElementById("pet");
const message = document.getElementById("message");
const yes = document.getElementById("yes");
const no = document.getElementById("no");
const buttons = document.getElementById("buttons");
const bar = document.getElementById("bar");
const footer = document.getElementById("footer");

let stageIndex = 0;
let itemIndex = 0;
let finalIndex = 0;
let phase = "opening";


/* ===== 表情图片配置 ===== */
const emojiImages = {
  cute: ["1.gif", "2.gif", "3.gif", "4.gif", "5.gif"],
  love: [
    "1.gif", "2.png", "3.gif", "4.png",
    "5.png", "6.png", "7.png", "8.gif"
  ],
  mad: ["1.gif"],
  sad: [
    "1.gif", "2.gif", "3.gif", "4.png",
    "5.gif", "6.gif", "7.png", "8.gif", "9.gif"
  ],
  good: ["1.gif"]
};

/* 记住上一张图，尽量避免连续重复 */
let lastEmoji = "";

function randomEmoji(folder) {
  const files = emojiImages[folder] || emojiImages.cute;

  let candidates = files.filter(file =>
    files.length === 1 || `emoji/${folder}/${file}` !== lastEmoji
  );

  if (!candidates.length) candidates = files;

  const file = candidates[Math.floor(Math.random() * candidates.length)];
  lastEmoji = `emoji/${folder}/${file}`;

  return lastEmoji;
}

/* 根据当前文案和情绪选择图片文件夹 */
function chooseEmojiFolder(text, mood) {
  if (mood === "good") return "good";
  if (mood === "mad") return "mad";

  if (/吃醋|生气|不理你|嫌我烦|闹脾气/.test(text)) {
    return "mad";
  }

  if (
    mood === "love" ||
    /喜欢你|I LOVE YOU|接住你的眼泪|依赖我|重新开始|舍不得离开我/.test(text)
  ) {
    return "love";
  }

  if (
    mood === "sad" ||
    mood === "cry" ||
    /对不起|我错了|伤心|难过|求求你|不要推开我|好痛/.test(text)
  ) {
    return "sad";
  }

  return "cute";
}

/* 替换原来的 show() */
function show(text, mood = "cute", emoji = "🐶") {
  message.textContent = text;

  const folder = chooseEmojiFolder(text, mood);
  const imagePath = randomEmoji(folder);

  scene.className = "scene " + mood;

  pet.innerHTML = "";

  const img = document.createElement("img");
  img.src = imagePath;
  img.alt = "小动物表情";
  img.draggable = false;

  img.onerror = function () {
    img.alt = "图片加载失败：" + imagePath;
    img.style.width = "100%";
    img.style.height = "auto";
  };

  pet.appendChild(img);

  if (typeof bar !== "undefined" && bar) {
    bar.style.width = getProgress() + "%";
  }

  if (mood === "happy" || mood === "love" || mood === "good") {
    hearts(3);
  }
}


function getProgress() {
  const total = stages.reduce((n, s) => n + s.items.length, 0)
    + finalItems.length;
  let done = 0;

  for (let i = 0; i < stageIndex; i++) {
    done += stages[i].items.length;
  }
  done += itemIndex;

  if (phase === "final" || phase === "loop") {
    done = stages.reduce((n, s) => n + s.items.length, 0)
      + finalIndex;
  }
  if (phase === "loop" || phase === "ending") return 100;
  return Math.min(99, Math.round(done / total * 100));
}

function hearts(count = 2) {
  const symbols = ["♡", "♥", "✦", "💕"];
  for (let i = 0; i < count; i++) {
    const el = document.createElement("span");
    el.className = "float-heart";
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.left = (20 + Math.random() * 60) + "vw";
    el.style.top = (50 + Math.random() * 35) + "vh";
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1900);
  }
}

function showQuestion(finalQuestion = false) {
  phase = finalQuestion ? "finalQuestion" : "opening";
  show("可以跟我和好吗？🥺", "shy", "🐶");
  yes.textContent = "♡ 和好 ♡";
  no.textContent = finalQuestion ? "真的不要" : "不要";
  buttons.classList.remove("hidden");
  footer.textContent = "再给小狗一次机会嘛…… ♡";
}

function nextApology() {
  // 跳过已经结束的阶段
  while (stageIndex < stages.length &&
         itemIndex >= stages[stageIndex].items.length) {
    stageIndex++;
    itemIndex = 0;
  }

  if (stageIndex >= stages.length) {
    showQuestion(true);
    return;
  }

  phase = "apology";
  const item = stages[stageIndex].items[itemIndex];
  itemIndex++;

  show(item[0], item[1], item[2]);

  // 最后一条文案也展示完之后，下一次点击进入最终阶段
  if (stageIndex === stages.length - 1 &&
      itemIndex === stages[stageIndex].items.length) {
    footer.textContent = "小狗还在努力想办法…… ♡";
  }
}

function nextFinal() {
  if (finalIndex < finalItems.length) {
    const item = finalItems[finalIndex];
    finalIndex++;
    phase = "final";
    show(item[0], item[1], item[2]);

    if (finalIndex === finalItems.length) {
      footer.textContent = "最后一次机会了……真的不抱抱吗？";
    }
    return;
  }

  phase = "loop";
  show("好吧，我放弃了…但我会一直等你的！", "sad", "🐶");
  footer.textContent = "你点多少次，小狗就等多少次。♡";
  no.textContent = "还是不要";
}


function makeUp() {
  phase = "ending";

  show(
    "我就知道你最好了！喜欢你🫶🏻！\n\n" +
    "让我们重新开始吧！🥹💕\n\n" +
    "mua ～ ( ˶ˆᗜˆ˵ ) ♡",
    "good"
  );

  buttons.innerHTML =
    '<button class="btn yes" id="restart">♡ 再抱一次 ♡</button>';

  document.getElementById("restart").addEventListener("click", restart);

  if (typeof bar !== "undefined" && bar) {
    bar.style.width = "100%";
  }

  footer.textContent = "ENDING UNLOCKED · 永远和姐姐贴贴 ♡";

  hearts(16);
}


function restart() {
  stageIndex = 0;
  itemIndex = 0;
  finalIndex = 0;

  buttons.innerHTML =
    '<button class="btn yes" id="yes">♡ 和好 ♡</button>' +
    '<button class="btn no" id="no">不要</button>';

  document.getElementById("yes").addEventListener("click", makeUp);
  document.getElementById("no").addEventListener("click", refuse);
  bar.style.width = "0";
  showQuestion(false);
}

function refuse() {
  if (phase === "opening") {
    stageIndex = 0;
    itemIndex = 0;
    nextApology();
    return;
  }

  if (phase === "apology") {
    nextApology();
    return;
  }

  if (phase === "finalQuestion") {
    finalIndex = 0;
    nextFinal();
    return;
  }

  if (phase === "final") {
    nextFinal();
    return;
  }

  if (phase === "loop") {
    show("好吧，我放弃了…但我会一直等你的！", "sad", "🐶");
    hearts(2);
    return;
  }

  if (phase === "ending") restart();
}

yes.addEventListener("click", makeUp);
no.addEventListener("click", refuse);
showQuestion(false);
</script>
